services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    ports:
      - "8080:80"

    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    environment:
      YII_ENV: dev
      YII_DEBUG: 1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aboutbigelmo
      DB_USER: aboutbigelmo
      DB_PASSWORD: password

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: aboutbigelmo
      POSTGRES_USER: aboutbigelmo
      POSTGRES_PASSWORD: password

    volumes:
      - local_postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aboutbigelmo -d aboutbigelmo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  local_postgres:
