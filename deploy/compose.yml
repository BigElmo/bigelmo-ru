services:
  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped

    ports:
      - "127.0.0.1:${HTTP_PORT}:80"

    depends_on:
      php:
        condition: service_healthy

  php:
    image: ${PHP_IMAGE}
    restart: unless-stopped

    environment:
      YII_ENV: ${YII_ENV}
      YII_DEBUG: ${YII_DEBUG}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r ''$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);''',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
