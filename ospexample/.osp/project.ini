[bigelmo.loc]

enabled       = on
ip            = auto
nginx_engine  = Nginx-1.28
php_engine    = PHP-8.4-FCGI
project_dir   = {root_dir}\repos\bigelmo-ru
project_url   = https://{host_decoded}
public_dir    = {root_dir}\repos\bigelmo-ru\web
ssl           = on
ssl_cert_file = auto
ssl_key_file  = auto
